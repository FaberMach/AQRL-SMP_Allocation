[project]
name = "aqrl"
version = "0.1.0"
description = "Autonomous Quant Research Lab — institutional quantitative research platform"
authors = [{ name = "FaberMach", email = "contact@example.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "numpy>=2.0.0,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "scipy>=1.14.0,<2.0.0",
  "pyarrow>=24.0.0,<25.0.0",
  "duckdb>=1.1.0,<2.0.0",
  "plotly>=5.24.0,<6.0.0",
  "typer>=0.12.0,<0.13.0",
  "rich>=13.8.0,<14.0.0",
  "pyyaml>=6.0.0,<7.0.0",
]

[tool.poetry]
packages = [{ include = "aqrl" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.11.0"
pandas-stubs = ">=2.2.0"
pre-commit = "^3.8.0"
types-PyYAML = ">=6.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

